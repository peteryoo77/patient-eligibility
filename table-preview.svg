<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="110" viewBox="0 0 1400 110" font-family="'Inter', sans-serif">
  <!-- Background -->
  <rect width="1400" height="110" fill="#ffffff"/>

  <!-- Blue active tab indicator -->
  <rect x="0" y="0" width="120" height="3" rx="1.5" fill="#0EA5E9"/>

  <!-- Header row background -->
  <rect x="0" y="3" width="1400" height="44" fill="#F9FAFB"/>

  <!-- Header bottom border -->
  <line x1="0" y1="47" x2="1400" y2="47" stroke="#E5E7EB" stroke-width="0.5"/>

  <!-- Row bottom border -->
  <line x1="0" y1="110" x2="1400" y2="110" stroke="#E5E7EB" stroke-width="0.5"/>

  <!-- Header: PATIENT -->
  <text x="28" y="29" font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="0.06em">PATIENT</text>
  <!-- sort icon -->
  <text x="86" y="29" font-size="11" fill="#9CA3AF">⇅</text>

  <!-- Header: (i) RISK -->
  <!-- info circle -->
  <circle cx="392" cy="25" r="6" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <circle cx="392" cy="22.5" r="0.8" fill="#9CA3AF"/>
  <line x1="392" y1="24.5" x2="392" y2="28.5" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
  <text x="403" y="29" font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="0.06em">RISK</text>
  <text x="431" y="29" font-size="11" fill="#9CA3AF">⇅</text>

  <!-- Header: DESCRIPTION -->
  <text x="560" y="29" font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="0.06em">DESCRIPTION</text>

  <!-- Header: ACTIONS -->
  <text x="1272" y="29" font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="0.06em">ACTIONS</text>

  <!-- Row: Samuel Osei -->
  <!-- Patient name -->
  <text x="28" y="74" font-size="14" font-weight="600" fill="#111827">Samuel Osei</text>
  <text x="28" y="92" font-size="13" fill="#6B7280">55 yo · Male</text>

  <!-- Risk badge: High -->
  <rect x="378" y="64" width="64" height="26" rx="13" fill="#FDF0EF"/>
  <text x="410" y="81" font-size="12" font-weight="600" fill="#C0392B" text-anchor="middle">High</text>

  <!-- Description -->
  <text x="560" y="74" font-size="13" fill="#374151">PHQ-9: 14 and GAD-7: 11; prior psychiatric hospitalization; DM and HTN with persistent non-</text>
  <text x="560" y="92" font-size="13" fill="#374151">adherence; housing insecure and socially isolated.</text>

  <!-- Enroll button -->
  <rect x="1258" y="62" width="90" height="34" rx="7" fill="#0EA5E9"/>
  <text x="1303" y="84" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Enroll</text>
</svg>
