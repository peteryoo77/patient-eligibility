<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Detail</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --bg:           #f8f9fa;
      --surface:      #ffffff;
      --border:       #e5e7eb;
      --text:         #111827;
      --text-mid:     #374151;
      --text-muted:   #6b7280;
      --primary:      #2563eb;
      --primary-light:#eff6ff;

      --pill-eligible-bg:    #eaf3de; --pill-eligible-text:  #3b6d11;
      --pill-ineligible-bg:  #f1efe8; --pill-ineligible-text:#5f5e5a;
      --pill-enrolled-bg:    #dbeafe; --pill-enrolled-text:  #1e40af;
      --warn-bg: #fffbeb; --warn-border: #fde68a; --warn-text: #92400e;

      --sig-chronic-bg:   #fcebeb; --sig-chronic-text: #a32d2d;
      --sig-er-bg:        #faeeda; --sig-er-text:      #854f0b;
      --sig-family-bg:    #eeedfe; --sig-family-text:  #3c3489;
      --sig-obs-bg:       #e6f1fb; --sig-obs-text:     #185fa5;

      --radius-sm: 8px;
      --radius-md: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:           #0f1117;
        --surface:      #1a1d27;
        --border:       #2d3040;
        --text:         #f1f5f9;
        --text-mid:     #cbd5e1;
        --text-muted:   #8b92a8;
        --primary:      #3b82f6;
        --primary-light:#1e3a5f;
        --pill-eligible-bg:    #152009; --pill-eligible-text:  #86efac;
        --pill-ineligible-bg:  #2a2a27; --pill-ineligible-text:#a8a8a3;
        --pill-enrolled-bg:    #1e3a5f; --pill-enrolled-text:  #93c5fd;
        --warn-bg: #2d2208; --warn-border: #854f0b; --warn-text: #fbbf24;
        --sig-chronic-bg: #2d1515; --sig-chronic-text: #f87171;
        --sig-er-bg:      #2d2208; --sig-er-text:      #fbbf24;
        --sig-family-bg:  #1e1a3a; --sig-family-text:  #a78bfa;
        --sig-obs-bg:     #162035; --sig-obs-text:     #60a5fa;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.5; min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 216px; min-height: 100vh; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
    }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 14px 12px; border-bottom: 1px solid var(--border); }
    .logo-icon { width: 34px; height: 34px; background: #1e293b; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .logo-sub  { font-size: 9.5px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 6px 0 8px; }
    .nav-label { font-size: 10.5px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase; padding: 14px 16px 4px; }
    .nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; margin: 1px 8px; font-size: 13.5px; font-weight: 500; color: var(--text-mid); border-radius: 7px; cursor: pointer; text-decoration: none; transition: background 0.12s, color 0.12s; }
    .nav-item i { font-size: 17px; color: var(--text-muted); flex-shrink: 0; }
    .nav-item:hover { background: var(--bg); }
    .nav-item:hover i { color: var(--text-mid); }
    .nav-item.active { background: var(--primary-light); color: var(--primary); }
    .nav-item.active i { color: var(--primary); }
    .sidebar-user { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; align-items: center; gap: 9px; }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .user-name  { font-size: 12.5px; font-weight: 600; color: var(--text); }
    .user-email { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }

    /* ── TOPBAR ── */
    .topbar { margin-left: 216px; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 32px; height: 56px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; }
    .back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-muted); text-decoration: none; padding: 5px 10px; border-radius: var(--radius-sm); transition: background 0.12s, color 0.12s; }
    .back-btn:hover { background: var(--bg); color: var(--text); }
    .back-btn i { font-size: 15px; }
    .topbar-divider { width: 1px; height: 18px; background: var(--border); }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }

    /* ── LAYOUT ── */
    .main { margin-left: 216px; padding: 32px 32px 80px; }

    /* ── PATIENT HEADER ── */
    .patient-header {
      display: flex; align-items: center; gap: 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 20px 24px;
      margin-bottom: 12px;
    }
    .header-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
    .header-info { flex: 1; min-width: 0; }
    .header-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 3px; }
    .header-name { font-size: 18px; font-weight: 700; color: var(--text); }
    .status-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-sm); white-space: nowrap; }
    .pill-eligible   { background: var(--pill-eligible-bg);   color: var(--pill-eligible-text); }
    .pill-ineligible { background: var(--pill-ineligible-bg); color: var(--pill-ineligible-text); }
    .header-meta { font-size: 13px; color: var(--text-muted); }

    /* ── SECTION CARD ── */
    .section-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 20px 24px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 14px;
    }

    /* ── ACTION ── */
    .action-area { display: flex; flex-direction: column; gap: 10px; }
    .btn-enroll { align-self: flex-start; padding: 8px 20px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.12s; }
    .btn-enroll:hover { opacity: 0.88; }
    .btn-enroll-outline { align-self: flex-start; padding: 7px 16px; border: 1px solid var(--primary); border-radius: var(--radius-sm); background: transparent; color: var(--primary); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.12s; }
    .btn-enroll-outline:hover { background: var(--primary-light); }
    .btn-ineligible { align-self: flex-start; padding: 7px 16px; border: 1px solid #d1d5db; border-radius: var(--radius-sm); background: transparent; color: #5f5e5a; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: border-color 0.12s, color 0.12s; }
    .btn-ineligible:hover { border-color: #9ca3af; color: var(--text-mid); }
    .btn-cancel { align-self: flex-start; padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); font-family: inherit; font-size: 13px; cursor: pointer; }
    .action-secondary { display: flex; padding-top: 4px; border-top: 1px solid var(--border); margin-top: 2px; }
    .note-field { display: flex; flex-direction: column; gap: 4px; }
    .note-label { font-size: 12px; color: var(--text-muted); }
    .note-input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; }
    .note-input:focus { outline: none; border-color: #9ca3af; }
    .ineligible-state { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .ineligible-note { font-size: 13px; color: var(--text-muted); flex: 1; min-width: 0; line-height: 1.5; }
    .undo-link { font-size: 13px; color: var(--text-muted); text-decoration: none; white-space: nowrap; align-self: center; }
    .undo-link:hover { color: var(--text); text-decoration: underline; }
    .enroll-warning { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius-sm); padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .warning-text { font-size: 13px; color: var(--warn-text); }
    .warning-actions { display: flex; gap: 8px; }
    .enrolled-state { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .enrolled-meta { font-size: 13px; color: var(--text-muted); flex: 1; }
    .pill-enrolled { background: var(--pill-enrolled-bg); color: var(--pill-enrolled-text); }

    /* ── SIGNAL BADGES ── */
    .signals-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .sig { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: var(--radius-sm); white-space: nowrap; }
    .sig-chronic { background: var(--sig-chronic-bg); color: var(--sig-chronic-text); }
    .sig-er      { background: var(--sig-er-bg);      color: var(--sig-er-text); }
    .sig-family  { background: var(--sig-family-bg);  color: var(--sig-family-text); }
    .sig-obs     { background: var(--sig-obs-bg);     color: var(--sig-obs-text); }

    /* ── REASONING ── */
    .reasoning-text { font-size: 14px; color: var(--text-mid); line-height: 1.65; }

    /* ── SCREENING SCORES ── */
    .scores-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .score-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 18px; }
    .score-box-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
    .score-box-num  { font-size: 36px; font-weight: 700; color: var(--text); line-height: 1; }
    .score-box-date { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .score-na { font-size: 13px; color: var(--text-muted); font-style: italic; padding: 6px 0; }

    /* ── CLINICAL GRID ── */
    .detail-grid { display: grid; grid-template-columns: 160px 1fr; gap: 10px 20px; align-items: start; }
    .detail-label { font-size: 13px; color: var(--text-muted); padding-top: 1px; }
    .detail-value { font-size: 14px; color: var(--text); font-weight: 500; line-height: 1.5; }
    .detail-na    { font-size: 13px; color: var(--text-muted); font-style: italic; }
    .detail-divider { grid-column: 1 / -1; height: 1px; background: var(--border); margin: 2px 0; }

    /* ── NOT FOUND ── */
    .not-found { text-align: center; padding: 80px 24px; color: var(--text-muted); font-size: 15px; }

    @media (max-width: 680px) {
      .sidebar { display: none; }
      .topbar, .main { margin-left: 0; }
      .main { padding: 16px 16px 60px; }
      .scores-pair { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; gap: 4px; }
      .detail-label { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">

  <header class="topbar">
    <a class="back-btn" href="index.html"><i class="ti ti-arrow-left"></i> Eligibility</a>
    <div class="topbar-divider"></div>
    <span class="topbar-title" id="topbar-name">Patient detail</span>
  </header>

  <main class="main" id="main-content">
    <div class="not-found">Loading…</div>
  </main>

  <script>
    const PATIENTS = [
      {
        id: 1, name: "James Lee", age: 52, lastVisit: "Apr 8, 2026", pcp: "Dr. Peter Yoo",
        status: "eligible",
        reasoning: "3 chronic conditions with recent ER utilization and patient-reported low mood — multiple converging signals suggest unaddressed behavioral health need.",
        signals: [
          { type: "obs",     label: "PHQ-9: 14" },
          { type: "chronic", label: "Type 2 diabetes" },
          { type: "chronic", label: "Hypertension" },
          { type: "er",      label: "2 ER visits / 90 days" },
          { type: "family",  label: "Family Hx: depression" },
          { type: "obs",     label: "Sleep complaints" }
        ],
        details: {
          mentalHealthDx:  null,
          psychiatricMeds: [],
          chronicDx:       ["Type 2 diabetes", "Hypertension", "Obesity"],
          erVisits:        "2 visits in the last 90 days",
          substanceUse:    null,
          familyHistory:   "Father: depression",
          phq9:            { score: 14, date: "Mar 20, 2026" },
          gad7:            null
        }
      },
      {
        id: 2, name: "Sofia Reyes", age: 38, lastVisit: "Apr 10, 2026", pcp: "Dr. Peter Yoo",
        status: "eligible",
        reasoning: "Chronic pain with frequent ER visits and clinically observed anxiety — pattern consistent with undertreated behavioral health need.",
        signals: [
          { type: "obs",     label: "PHQ-9: 11" },
          { type: "obs",     label: "GAD-7: 12" },
          { type: "chronic", label: "Chronic pain syndrome" },
          { type: "er",      label: "3 ER visits / 6 months" },
          { type: "obs",     label: "Sleep complaints" }
        ],
        details: {
          mentalHealthDx:  null,
          psychiatricMeds: [],
          chronicDx:       ["Chronic pain syndrome", "Fibromyalgia"],
          erVisits:        "3 visits in the last 6 months",
          substanceUse:    null,
          familyHistory:   null,
          phq9:            { score: 11, date: "Mar 30, 2026" },
          gad7:            { score: 12, date: "Mar 30, 2026" }
        }
      },
      {
        id: 3, name: "Thomas Nguyen", age: 45, lastVisit: "Mar 28, 2026", pcp: "Dr. Peter Yoo",
        status: "eligible",
        reasoning: "Single chronic condition with family history and self-reported stress — worth monitoring closely.",
        signals: [
          { type: "obs",     label: "GAD-7: 9" },
          { type: "chronic", label: "Hypertension" },
          { type: "family",  label: "Family Hx: anxiety" },
          { type: "obs",     label: "Stress reported" }
        ],
        details: {
          mentalHealthDx:  null,
          psychiatricMeds: [],
          chronicDx:       ["Hypertension"],
          erVisits:        null,
          substanceUse:    null,
          familyHistory:   "Mother: generalized anxiety disorder",
          phq9:            { score: 7, date: "Feb 14, 2026" },
          gad7:            { score: 9, date: "Feb 14, 2026" }
        }
      },
      {
        id: 4, name: "Maria Okonkwo", age: 61, lastVisit: "Apr 2, 2026", pcp: "Dr. Peter Yoo",
        status: "eligible",
        reasoning: "Chronic condition with family history and fatigue — may be masking underlying depression.",
        signals: [
          { type: "obs",     label: "PHQ-9: 8" },
          { type: "chronic", label: "Type 2 diabetes" },
          { type: "family",  label: "Family Hx: depression" },
          { type: "obs",     label: "Fatigue reported" }
        ],
        details: {
          mentalHealthDx:  null,
          psychiatricMeds: [],
          chronicDx:       ["Type 2 diabetes", "Hypothyroidism"],
          erVisits:        null,
          substanceUse:    null,
          familyHistory:   "Mother: major depression",
          phq9:            { score: 8, date: "Mar 5, 2026" },
          gad7:            null
        }
      },
      {
        id: 5, name: "David Walsh", age: 29, lastVisit: "Apr 5, 2026", pcp: "Dr. Peter Yoo",
        status: "ineligible",
        note: "Insufficient signals. Family history only, no chronic conditions or ER visits.",
        reasoning: "Family history only with mild sleep complaints — no chronic conditions or ER visits; does not meet CoCM threshold at this time.",
        signals: [
          { type: "obs",    label: "PHQ-9: 4" },
          { type: "family", label: "Family Hx: depression" },
          { type: "obs",    label: "Sleep complaints" }
        ],
        details: {
          mentalHealthDx:  null,
          psychiatricMeds: [],
          chronicDx:       [],
          erVisits:        null,
          substanceUse:    null,
          familyHistory:   "Sibling: depression",
          phq9:            { score: 4, date: "Apr 1, 2026" },
          gad7:            null
        }
      },
      {
        id: 6, name: "Linda Park", age: 55, lastVisit: "Apr 1, 2026", pcp: "Dr. Peter Yoo",
        status: "eligible",
        reasoning: "Two chronic conditions with a recent ER visit and a documented depression diagnosis — signals strongly align with CoCM eligibility criteria.",
        signals: [
          { type: "obs",     label: "PHQ-9: 12" },
          { type: "obs",     label: "MDD — mild (F32.0)" },
          { type: "chronic", label: "COPD" },
          { type: "chronic", label: "Hypertension" },
          { type: "er",      label: "1 ER visit / 30 days" },
          { type: "obs",     label: "Low mood reported" }
        ],
        details: {
          mentalHealthDx:  "F32.0 — Major depressive disorder, mild",
          psychiatricMeds: ["Sertraline 50mg"],
          chronicDx:       ["COPD", "Hypertension"],
          erVisits:        "1 visit in the last 30 days",
          substanceUse:    null,
          familyHistory:   null,
          phq9:            { score: 12, date: "Mar 28, 2026" },
          gad7:            null
        }
      }
    ];

    let currentPatientId = null;
    let pendingEnroll    = false;

    function initials(name) {
      return name.split(' ').map(w => w[0]).join('').toUpperCase();
    }

    function getEffectiveStatus(p) {
      return localStorage.getItem('status_' + p.id) || p.status;
    }

    function getEffectiveNote(p) {
      const stored = localStorage.getItem('note_' + p.id);
      return stored !== null ? stored : (p.note || null);
    }

    function enroll() {
      const now = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      localStorage.setItem('status_' + currentPatientId, 'enrolled');
      localStorage.setItem('enrolledDate_' + currentPatientId, now);
      pendingEnroll = false;
      render();
    }

    function triggerEnroll() {
      const p = PATIENTS.find(x => x.id === currentPatientId);
      if (getEffectiveStatus(p) === 'ineligible') {
        pendingEnroll = true;
        render();
      } else {
        enroll();
      }
    }

    function cancelEnroll() {
      pendingEnroll = false;
      render();
    }

    function unenroll() {
      localStorage.removeItem('status_' + currentPatientId);
      localStorage.removeItem('enrolledDate_' + currentPatientId);
      pendingEnroll = false;
      render();
    }

    function markIneligible() {
      const noteEl = document.getElementById('note-input');
      const note   = noteEl ? noteEl.value.trim() : '';
      localStorage.setItem('status_' + currentPatientId, 'ineligible');
      if (note) localStorage.setItem('note_' + currentPatientId, note);
      else      localStorage.removeItem('note_' + currentPatientId);
      pendingEnroll = false;
      render();
    }

    function markEligible() {
      localStorage.setItem('status_' + currentPatientId, 'eligible');
      localStorage.removeItem('note_' + currentPatientId);
      pendingEnroll = false;
      render();
    }

    function scoreBox(label, scoreObj) {
      if (scoreObj) {
        return `
          <div class="score-box">
            <div class="score-box-label">${label}</div>
            <div class="score-box-num">${scoreObj.score}</div>
            <div class="score-box-date">${scoreObj.date}</div>
          </div>`;
      }
      return `
        <div class="score-box">
          <div class="score-box-label">${label}</div>
          <div class="score-na">Not yet administered</div>
        </div>`;
    }

    function row(label, value) {
      return `<span class="detail-label">${label}</span>` +
             (value
               ? `<span class="detail-value">${value}</span>`
               : `<span class="detail-na">Not documented</span>`);
    }

    function render() {
      const params = new URLSearchParams(location.search);
      const id = parseInt(params.get('id'), 10);
      const p  = PATIENTS.find(x => x.id === id);
      currentPatientId = id;
      const main = document.getElementById('main-content');

      if (!p) {
        main.innerHTML = `<div class="not-found">Patient not found.</div>`;
        return;
      }

      document.title = p.name + ' — Patient Detail';
      document.getElementById('topbar-name').textContent = p.name;

      const status    = getEffectiveStatus(p);
      const note      = getEffectiveNote(p);
      const pillLabel = status.charAt(0).toUpperCase() + status.slice(1);
      const d = p.details;

      // ── Action card ──────────────────────────────────────────
      let actionHtml;
      if (status === 'enrolled') {
        const enrolledDate = localStorage.getItem('enrolledDate_' + p.id) || '';
        actionHtml = `
          <div class="section-card">
            <div class="enrolled-state">
              <span class="status-pill pill-enrolled">Enrolled</span>
              <span class="enrolled-meta">${enrolledDate ? 'Enrolled ' + enrolledDate : ''}</span>
              <a class="undo-link" href="#" onclick="unenroll(); return false;">Undo</a>
            </div>
          </div>`;
      } else if (status === 'eligible') {
        actionHtml = `
          <div class="section-card">
            <div class="action-area">
              <button class="btn-enroll" onclick="triggerEnroll()">Enroll in CoCM</button>
              <div class="action-secondary">
                <button class="btn-ineligible" onclick="markIneligible()">Mark ineligible</button>
              </div>
            </div>
          </div>`;
      } else {
        const warningHtml = pendingEnroll ? `
          <div class="enroll-warning">
            <span class="warning-text">This patient is marked ineligible. Enroll anyway?</span>
            <div class="warning-actions">
              <button class="btn-enroll" onclick="enroll()">Confirm enrollment</button>
              <button class="btn-cancel" onclick="cancelEnroll()">Cancel</button>
            </div>
          </div>` : `<button class="btn-enroll-outline" onclick="triggerEnroll()">Enroll in CoCM</button>`;
        actionHtml = `
          <div class="section-card">
            <div class="ineligible-state">
              <span class="status-pill pill-ineligible">Ineligible</span>
              ${note ? `<span class="ineligible-note">${note}</span>` : ''}
              <a class="undo-link" href="#" onclick="markEligible(); return false;">Mark eligible</a>
            </div>
            ${warningHtml}
          </div>`;
      }

      // ── Eligibility summary ──────────────────────────────────
      const signalBadges = p.signals.map(s =>
        `<span class="sig sig-${s.type}">${s.label}</span>`
      ).join('');

      const summaryHtml = `
        <div class="section-card">
          <div class="section-title">Eligibility Summary</div>
          <div class="signals-wrap">${signalBadges}</div>
          <p class="reasoning-text">${p.reasoning}</p>
        </div>`;

      // ── Screening scores ─────────────────────────────────────
      const scoresHtml = `
        <div class="section-card">
          <div class="section-title">Screening Scores</div>
          <div class="scores-pair">
            ${scoreBox('PHQ-9', d.phq9)}
            ${scoreBox('GAD-7', d.gad7)}
          </div>
        </div>`;

      // ── Mental health ────────────────────────────────────────
      const mhRows = [
        row('Diagnosis',         d.mentalHealthDx),
        '<div class="detail-divider"></div>',
        row('Psychiatric meds',  d.psychiatricMeds?.length ? d.psychiatricMeds.join('<br>') : null),
        '<div class="detail-divider"></div>',
        row('Substance use',     d.substanceUse),
      ].join('');

      const mentalHtml = `
        <div class="section-card">
          <div class="section-title">Mental Health</div>
          <div class="detail-grid">${mhRows}</div>
        </div>`;

      // ── Physical health ──────────────────────────────────────
      const phRows = [
        row('Chronic conditions', d.chronicDx?.length ? d.chronicDx.join('<br>') : null),
        '<div class="detail-divider"></div>',
        row('ER visits',          d.erVisits),
      ].join('');

      const physicalHtml = `
        <div class="section-card">
          <div class="section-title">Physical Health</div>
          <div class="detail-grid">${phRows}</div>
        </div>`;

      // ── Background ───────────────────────────────────────────
      const bgHtml = `
        <div class="section-card">
          <div class="section-title">Background</div>
          <div class="detail-grid">
            ${row('Family history', d.familyHistory)}
          </div>
        </div>`;

      main.innerHTML = `
        <div class="patient-header">
          <div class="header-avatar">${initials(p.name)}</div>
          <div class="header-info">
            <div class="header-name-row">
              <span class="header-name">${p.name}</span>
              <span class="status-pill pill-${status}">${pillLabel}</span>
            </div>
            <div class="header-meta">${p.age} yo · Last visit ${p.lastVisit} · ${p.pcp}</div>
          </div>
        </div>
        ${actionHtml}
        ${summaryHtml}
        ${scoresHtml}
        ${mentalHtml}
        ${physicalHtml}
        ${bgHtml}
      `;
    }

    render();
  </script>
</body>
</html>
