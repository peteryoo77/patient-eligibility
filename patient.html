<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Detail</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --bg:           #f8f9fa;
      --surface:      #ffffff;
      --border:       #e5e7eb;
      --text:         #111827;
      --text-mid:     #374151;
      --text-muted:   #6b7280;
      --primary:      #00AFF1;
      --primary-dark: #0099d4;
      --primary-light:#e0f6fe;

      --pill-eligible-bg:    #eaf3de; --pill-eligible-text:  #3b6d11;
      --pill-ineligible-bg:  #f1efe8; --pill-ineligible-text:#5f5e5a;

      --risk-high-bg:   #fee2e2; --risk-high-text:   #991b1b;
      --risk-medium-bg: #fef3c7; --risk-medium-text: #92400e;
      --risk-low-bg:    #f3f4f6; --risk-low-text:    #374151;

      --sig-chronic-bg:   #fcebeb; --sig-chronic-text: #a32d2d;
      --sig-er-bg:        #faeeda; --sig-er-text:      #854f0b;
      --sig-family-bg:    #eeedfe; --sig-family-text:  #3c3489;
      --sig-obs-bg:       #e6f1fb; --sig-obs-text:     #185fa5;

      --radius-sm: 8px;
      --radius-md: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:           #0f1117;
        --surface:      #1a1d27;
        --border:       #2d3040;
        --text:         #f1f5f9;
        --text-mid:     #cbd5e1;
        --text-muted:   #8b92a8;
        --primary:      #00AFF1;
        --primary-dark: #0099d4;
        --primary-light:#003d52;
        --pill-eligible-bg:    #152009; --pill-eligible-text:  #86efac;
        --pill-ineligible-bg:  #2a2a27; --pill-ineligible-text:#a8a8a3;
        --risk-high-bg:   #2d0f0f; --risk-high-text:   #fca5a5;
        --risk-medium-bg: #2d2208; --risk-medium-text: #fcd34d;
        --risk-low-bg:    #1f2937; --risk-low-text:    #9ca3af;
        --sig-chronic-bg: #2d1515; --sig-chronic-text: #f87171;
        --sig-er-bg:      #2d2208; --sig-er-text:      #fbbf24;
        --sig-family-bg:  #1e1a3a; --sig-family-text:  #a78bfa;
        --sig-obs-bg:     #162035; --sig-obs-text:     #60a5fa;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.5; min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 216px; min-height: 100vh; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
    }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 14px 12px; border-bottom: 1px solid var(--border); }
    .logo-icon { width: 34px; height: 34px; background: #1e293b; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .logo-sub  { font-size: 9.5px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 6px 0 8px; }
    .nav-label { font-size: 10.5px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase; padding: 14px 16px 4px; }
    .nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; margin: 1px 8px; font-size: 13.5px; font-weight: 500; color: var(--text-mid); border-radius: 7px; cursor: pointer; text-decoration: none; transition: background 0.12s, color 0.12s; }
    .nav-item i { font-size: 17px; color: var(--text-muted); flex-shrink: 0; }
    .nav-item:hover { background: var(--bg); }
    .nav-item:hover i { color: var(--text-mid); }
    .nav-item.active { background: var(--primary-light); color: var(--primary); }
    .nav-item.active i { color: var(--primary); }
    .sidebar-user { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; align-items: center; gap: 9px; }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .user-name  { font-size: 12.5px; font-weight: 600; color: var(--text); }
    .user-email { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }

    /* ── TOPBAR ── */
    .topbar { margin-left: 216px; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 32px; height: 56px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; }
    .back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-muted); text-decoration: none; padding: 5px 10px; border-radius: var(--radius-sm); transition: background 0.12s, color 0.12s; }
    .back-btn:hover { background: var(--bg); color: var(--text); }
    .back-btn i { font-size: 15px; }
    .topbar-divider { width: 1px; height: 18px; background: var(--border); }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }

    /* ── LAYOUT ── */
    .main { margin-left: 216px; padding: 32px 32px 80px; }

    /* ── PATIENT HEADER ── */
    .patient-header {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 24px 28px;
      margin-bottom: 12px;
    }
    .header-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .header-name { font-size: 22px; font-weight: 700; color: var(--text); }
    .header-meta { font-size: 13px; color: var(--text-muted); }

    .status-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-sm); white-space: nowrap; }
    .pill-eligible   { background: var(--pill-eligible-bg);   color: var(--pill-eligible-text); }
    .pill-ineligible { background: var(--pill-ineligible-bg); color: var(--pill-ineligible-text); }
    .pill-archived   { background: var(--pill-ineligible-bg); color: var(--pill-ineligible-text); }

    .risk-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .risk-high   { background: var(--risk-high-bg);   color: var(--risk-high-text); }
    .risk-medium { background: var(--risk-medium-bg); color: var(--risk-medium-text); }
    .risk-low    { background: var(--risk-low-bg);    color: var(--risk-low-text); }

    /* ── SECTION CARD ── */
    .section-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 20px 24px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px;
    }

    /* ── REFERRAL DECISION ── */
    .referral-rec { margin-bottom: 16px; }
    .referral-rec-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
    .referral-rec-text { font-size: 15px; font-weight: 600; color: var(--text); }
    .referral-rec-text.rec-yes { color: #0369a1; }
    .referral-rec-text.rec-no  { color: var(--text-muted); }
    .referral-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-refer-cocm { padding: 10px 22px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.12s; }
    .btn-refer-cocm:hover { opacity: 0.88; }
    .btn-refer-specialty { padding: 10px 22px; background: transparent; color: var(--text-mid); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: border-color 0.12s, color 0.12s; }
    .btn-refer-specialty:hover { border-color: #9ca3af; color: var(--text); }
    .action-tertiary { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .btn-ineligible { background: none; border: none; font-family: inherit; font-size: 13px; color: var(--text-muted); cursor: pointer; padding: 0; text-decoration: underline; text-decoration-color: transparent; transition: color 0.12s, text-decoration-color 0.12s; }
    .btn-ineligible:hover { color: var(--text); text-decoration-color: var(--text-muted); }

    /* ── INELIGIBLE / ARCHIVED STATES ── */
    .ineligible-state { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .ineligible-note { font-size: 13px; color: var(--text-muted); flex: 1; min-width: 0; line-height: 1.5; }
    .archived-state { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .state-actions { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
    .btn-archive { padding: 7px 16px; border: 1px solid #d1d5db; border-radius: var(--radius-sm); background: transparent; color: #5f5e5a; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: border-color 0.12s; }
    .btn-archive:hover { border-color: #9ca3af; color: var(--text-mid); }
    .undo-link { font-size: 13px; color: var(--text-muted); text-decoration: none; white-space: nowrap; align-self: center; }
    .undo-link:hover { color: var(--text); text-decoration: underline; }

    /* ── SIGNAL BADGES ── */
    .signals-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .sig { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .sig-chronic { background: var(--sig-chronic-bg); color: var(--sig-chronic-text); }
    .sig-er      { background: var(--sig-er-bg);      color: var(--sig-er-text); }
    .sig-family  { background: var(--sig-family-bg);  color: var(--sig-family-text); }
    .sig-obs     { background: var(--sig-obs-bg);     color: var(--sig-obs-text); }

    .reasoning-text { font-size: 14px; color: var(--text-mid); line-height: 1.65; }

    /* ── SCREENING SCORES ── */
    .scores-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .score-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 18px; }
    .score-box-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
    .score-box-num  { font-size: 36px; font-weight: 700; color: var(--text); line-height: 1; }
    .score-box-date { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .score-na { font-size: 13px; color: var(--text-muted); font-style: italic; padding: 6px 0; }

    /* ── CLINICAL GRID ── */
    .detail-grid { display: grid; grid-template-columns: 180px 1fr; gap: 12px 24px; align-items: start; }
    .detail-label { font-size: 13px; color: var(--text-muted); padding-top: 1px; }
    .detail-value { font-size: 14px; color: var(--text); font-weight: 500; line-height: 1.5; }
    .detail-na    { font-size: 13px; color: var(--text-muted); font-style: italic; }
    .detail-divider { grid-column: 1 / -1; height: 1px; background: var(--border); margin: 2px 0; }

    /* ── NOT FOUND ── */
    .not-found { text-align: center; padding: 80px 24px; color: var(--text-muted); font-size: 15px; }

    @media (max-width: 680px) {
      .sidebar { display: none; }
      .topbar, .main { margin-left: 0; }
      .main { padding: 16px 16px 60px; }
      .scores-pair { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; gap: 4px; }
      .detail-label { font-size: 11px; margin-top: 8px; }
    }
  </style>
</head>

        ],
        details: {
          mentalHealthDx:  "F32.0 — Major depressive disorder, mild",
          psychiatricMeds: ["Sertraline 50mg"],
          chronicDx:       ["COPD", "Hypertension"],
          erVisits:        "1 visit in the last 30 days",
          substanceUse:    null,
          familyHistory:   null,
          phq9:            { score: 12, date: "Mar 28, 2026" },
          gad7:            null
        }
      }
    ];

    let currentPatientId = null;

    const RISK_LABELS = { high: 'High Risk', medium: 'Medium Risk', low: 'Low Risk' };

    function getEffectiveStatus(p) {
      return localStorage.getItem('status_' + p.id) || p.status;
    }

    function getEffectiveNote(p) {
      const stored = localStorage.getItem('note_' + p.id);
      return stored !== null ? stored : (p.note || null);
    }

    function markIneligible() {
      localStorage.setItem('status_' + currentPatientId, 'ineligible');
      render();
    }

    function markEligible() {
      localStorage.setItem('status_' + currentPatientId, 'eligible');
      localStorage.removeItem('note_' + currentPatientId);
      render();
    }

    function archive() {
      localStorage.setItem('status_' + currentPatientId, 'archived');
      render();
    }

    function unarchive() {
      localStorage.setItem('status_' + currentPatientId, 'ineligible');
      render();
    }

    function scoreBox(label, scoreObj) {
      if (scoreObj) {
        return `<div class="score-box">
          <div class="score-box-label">${label}</div>
          <div class="score-box-num">${scoreObj.score}</div>
          <div class="score-box-date">${scoreObj.date}</div>
        </div>`;
      }
      return `<div class="score-box">
        <div class="score-box-label">${label}</div>
        <div class="score-na">Not yet administered</div>
      </div>`;
    }

    function row(label, value) {
      return `<span class="detail-label">${label}</span>` +
             (value
               ? `<span class="detail-value">${value}</span>`
               : `<span class="detail-na">Not documented</span>`);
    }

    function render() {
      const params = new URLSearchParams(location.search);
      const id = parseInt(params.get('id'), 10);
      const p  = PATIENTS.find(x => x.id === id);
      currentPatientId = id;
      const main = document.getElementById('main-content');

      if (!p) {
        main.innerHTML = `<div class="not-found">Patient not found.</div>`;
        return;
      }

      document.title = p.name + ' — Patient Detail';
      document.getElementById('topbar-name').textContent = p.name;

      const status    = getEffectiveStatus(p);
      const note      = getEffectiveNote(p);
      const pillLabel = status.charAt(0).toUpperCase() + status.slice(1);
      const tierLabel = RISK_LABELS[p.riskTier] || '';
      const d = p.details;

      // ── Patient header ───────────────────────────────────────
      const headerHtml = `
        <div class="patient-header">
          <div class="header-name-row">
            <span class="header-name">${p.name}</span>
            <span class="risk-badge risk-${p.riskTier}">${tierLabel}</span>
            <span class="status-pill pill-${status}">${pillLabel}</span>
          </div>
          <div class="header-meta">${p.age} yo · ${p.gender} · Last visit ${p.lastVisit} · ${p.pcp}</div>
        </div>`;

      // ── Referral decision card ───────────────────────────────
      let actionHtml;
      if (status === 'archived') {
        actionHtml = `
          <div class="section-card">
            <div class="section-title">Referral Decision</div>
            <div class="archived-state">
              <span class="status-pill pill-archived">Archived</span>
              <span style="font-size:13px;color:var(--text-muted);flex:1;">This patient has been archived.</span>
              <a class="undo-link" href="#" onclick="unarchive(); return false;">Unarchive</a>
            </div>
          </div>`;
      } else if (status === 'eligible') {
        actionHtml = `
          <div class="section-card">
            <div class="section-title">Referral Decision</div>
            <div class="referral-rec">
              <div class="referral-rec-label">Recommendation</div>
              <div class="referral-rec-text rec-yes">Refer to CoCM</div>
            </div>
            <div class="referral-buttons">
              <button class="btn-refer-cocm" onclick="alert('Referral flow coming soon.')">Refer to CoCM</button>
              <button class="btn-refer-specialty" onclick="alert('Specialty referral flow coming soon.')">Refer to specialty care</button>
            </div>
            <div class="action-tertiary">
              <button class="btn-ineligible" onclick="markIneligible()">Mark as ineligible</button>
            </div>
          </div>`;
      } else {
        actionHtml = `
          <div class="section-card">
            <div class="section-title">Referral Decision</div>
            <div class="referral-rec">
              <div class="referral-rec-label">Recommendation</div>
              <div class="referral-rec-text rec-no">Not eligible for CoCM at this time</div>
            </div>
            <div class="ineligible-state">
              <span class="status-pill pill-ineligible">Ineligible</span>
              ${note ? `<span class="ineligible-note">${note}</span>` : ''}
              <a class="undo-link" href="#" onclick="markEligible(); return false;">Mark eligible</a>
            </div>
            <div class="state-actions">
              <button class="btn-archive" onclick="archive()">Archive</button>
            </div>
          </div>`;
      }

      // ── Why this patient ─────────────────────────────────────
      const signalBadges = p.signals.map(s =>
        `<span class="sig sig-${s.type}">${s.label}</span>`
      ).join('');

      const whyHtml = `
        <div class="section-card">
          <div class="section-title">Why This Patient</div>
          <div class="signals-wrap">${signalBadges}</div>
          <p class="reasoning-text">${p.reasoning}</p>
        </div>`;

      // ── Screening scores ─────────────────────────────────────
      const scoresHtml = `
        <div class="section-card">
          <div class="section-title">Screening Scores</div>
          <div class="scores-pair">
            ${scoreBox('PHQ-9', d.phq9)}
            ${scoreBox('GAD-7', d.gad7)}
          </div>
        </div>`;

      // ── Clinical picture (merged) ────────────────────────────
      const clinicalRows = [
        row('Mental health dx',   d.mentalHealthDx),
        '<div class="detail-divider"></div>',
        row('Psychiatric meds',   d.psychiatricMeds?.length ? d.psychiatricMeds.join('<br>') : null),
        '<div class="detail-divider"></div>',
        row('Chronic conditions', d.chronicDx?.length ? d.chronicDx.join('<br>') : null),
        '<div class="detail-divider"></div>',
        row('ER visits',          d.erVisits),
        '<div class="detail-divider"></div>',
        row('Substance use',      d.substanceUse),
        '<div class="detail-divider"></div>',
        row('Family history',     d.familyHistory),
      ].join('');

      const clinicalHtml = `
        <div class="section-card">
          <div class="section-title">Clinical Picture</div>
          <div class="detail-grid">${clinicalRows}</div>
        </div>`;

      main.innerHTML = `
        ${headerHtml}
        ${actionHtml}
        ${whyHtml}
        ${scoresHtml}
        ${clinicalHtml}
      `;
    }

    render();
  </script>
</body>
</html>
