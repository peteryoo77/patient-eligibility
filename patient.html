<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Detail</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --bg:           #f8f9fa;
      --surface:      #ffffff;
      --border:       #e5e7eb;
      --text:         #111827;
      --text-mid:     #374151;
      --text-muted:   #6b7280;
      --primary:      #2563eb;
      --primary-light:#eff6ff;

      --pill-eligible-bg:    #eaf3de;
      --pill-eligible-text:  #3b6d11;
      --pill-ineligible-bg:  #f1efe8;
      --pill-ineligible-text:#5f5e5a;

      --sig-chronic-bg:   #fcebeb; --sig-chronic-text: #a32d2d;
      --sig-er-bg:        #faeeda; --sig-er-text:      #854f0b;
      --sig-family-bg:    #eeedfe; --sig-family-text:  #3c3489;
      --sig-obs-bg:       #e6f1fb; --sig-obs-text:     #185fa5;

      --radius-sm: 8px;
      --radius-md: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:           #0f1117;
        --surface:      #1a1d27;
        --border:       #2d3040;
        --text:         #f1f5f9;
        --text-mid:     #cbd5e1;
        --text-muted:   #8b92a8;
        --primary:      #3b82f6;
        --primary-light:#1e3a5f;

        --pill-eligible-bg:    #152009; --pill-eligible-text:  #86efac;
        --pill-ineligible-bg:  #2a2a27; --pill-ineligible-text:#a8a8a3;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.5; min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 216px; min-height: 100vh;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 12px; border-bottom: 1px solid var(--border);
    }
    .logo-icon {
      width: 34px; height: 34px; background: #1e293b;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .logo-sub  { font-size: 9.5px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 6px 0 8px; }
    .nav-label {
      font-size: 10.5px; font-weight: 600; color: var(--text-muted);
      letter-spacing: 0.07em; text-transform: uppercase; padding: 14px 16px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 10px; margin: 1px 8px;
      font-size: 13.5px; font-weight: 500; color: var(--text-mid);
      border-radius: 7px; cursor: pointer; text-decoration: none;
      transition: background 0.12s, color 0.12s;
    }
    .nav-item i { font-size: 17px; color: var(--text-muted); flex-shrink: 0; }
    .nav-item:hover { background: var(--bg); }
    .nav-item:hover i { color: var(--text-mid); }
    .nav-item.active { background: var(--primary-light); color: var(--primary); }
    .nav-item.active i { color: var(--primary); }
    .sidebar-user {
      border-top: 1px solid var(--border); padding: 10px 12px;
      display: flex; align-items: center; gap: 9px;
    }
    .user-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    .user-name  { font-size: 12.5px; font-weight: 600; color: var(--text); }
    .user-email { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }

    /* ── TOPBAR ── */
    .topbar {
      margin-left: 216px; background: var(--surface);
      border-bottom: 1px solid var(--border); padding: 0 32px; height: 56px;
      display: flex; align-items: center; gap: 14px;
      position: sticky; top: 0; z-index: 10;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 500; color: var(--text-muted);
      text-decoration: none; padding: 5px 10px; border-radius: var(--radius-sm);
      transition: background 0.12s, color 0.12s;
    }
    .back-btn:hover { background: var(--bg); color: var(--text); }
    .back-btn i { font-size: 15px; }
    .topbar-divider { width: 1px; height: 18px; background: var(--border); }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }

    /* ── MAIN ── */
    .main { margin-left: 216px; padding: 28px 32px 80px; max-width: 760px; }

    /* ── PATIENT HEADER ── */
    .patient-header {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 16px 20px;
      margin-bottom: 10px;
    }
    .header-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .header-info { flex: 1; min-width: 0; }
    .header-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .header-name { font-size: 16px; font-weight: 700; color: var(--text); }
    .status-pill {
      font-size: 11px; font-weight: 700;
      padding: 2px 9px; border-radius: var(--radius-sm); white-space: nowrap;
    }
    .pill-eligible   { background: var(--pill-eligible-bg);   color: var(--pill-eligible-text); }
    .pill-ineligible { background: var(--pill-ineligible-bg); color: var(--pill-ineligible-text); }
    .header-meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* ── CARD ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 18px 20px;
      margin-bottom: 10px;
    }

    /* ── ACTION ── */
    .action-area { display: flex; flex-direction: column; gap: 10px; }
    .btn-ineligible {
      align-self: flex-start; padding: 7px 16px;
      border: 1px solid #d1d5db; border-radius: var(--radius-sm);
      background: transparent; color: #5f5e5a;
      font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
    }
    .btn-ineligible:hover { border-color: #9ca3af; color: var(--text-mid); }
    .note-field { display: flex; flex-direction: column; gap: 4px; }
    .note-label { font-size: 12px; color: var(--text-muted); }
    .note-input {
      width: 100%; padding: 7px 10px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text);
      font-family: inherit; font-size: 14px;
    }
    .note-input:focus { outline: none; border-color: #9ca3af; }

    .ineligible-state { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .ineligible-note { font-size: 13px; color: var(--text-muted); flex: 1; min-width: 0; line-height: 1.5; }
    .undo-link { font-size: 13px; color: var(--text-muted); text-decoration: none; white-space: nowrap; align-self: center; }
    .undo-link:hover { color: var(--text); text-decoration: underline; }

    /* ── CLINICAL DATA ── */
    .scores-row { display: flex; gap: 28px; margin-bottom: 0; }
    .score-block { display: flex; flex-direction: column; gap: 1px; }
    .score-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .score-num   { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.1; }
    .score-date  { font-size: 11px; color: var(--text-muted); }

    .emr-grid {
      display: grid; grid-template-columns: 150px 1fr; gap: 8px 16px;
    }
    .emr-grid.with-scores { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .emr-label { font-size: 13px; color: var(--text-muted); }
    .emr-value { font-size: 13px; color: var(--text); font-weight: 500; }
    .emr-divider { grid-column: 1 / -1; height: 1px; background: var(--border); margin: 1px 0; }

    /* ── NOT FOUND ── */
    .not-found { text-align: center; padding: 80px 24px; color: var(--text-muted); font-size: 15px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 680px) {
      .sidebar { display: none; }
      .topbar, .main { margin-left: 0; }
      .main { padding: 16px 16px 60px; }
      .emr-grid { grid-template-columns: 1fr; gap: 2px; }
      .emr-label { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
      .scores-row { gap: 20px; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <i class="ti ti-heartbeat" style="font-size:17px;color:white;"></i>
      </div>
      <div>
        <div class="logo-name">Integral Health</div>
        <div class="logo-sub">Mission Control</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
      <div class="nav-label">General</div>
      <a class="nav-item" href="#"><i class="ti ti-users"></i> Patients</a>
      <a class="nav-item" href="#"><i class="ti ti-calendar"></i> Appointments</a>
      <div class="nav-label">Clinical</div>
      <a class="nav-item" href="#"><i class="ti ti-stethoscope"></i> Team</a>
      <a class="nav-item" href="#"><i class="ti ti-clock"></i> Time</a>
      <a class="nav-item" href="#"><i class="ti ti-clipboard-list"></i> Caseload</a>
      <a class="nav-item" href="#"><i class="ti ti-chart-bar"></i> Performance</a>
      <a class="nav-item active" href="index.html"><i class="ti ti-shield-check"></i> Eligibility</a>
      <div class="nav-label">Operations</div>
      <a class="nav-item" href="#"><i class="ti ti-list"></i> Waitlist</a>
      <a class="nav-item" href="#"><i class="ti ti-bookmark"></i> Follow-up</a>
      <a class="nav-item" href="#"><i class="ti ti-flag"></i> Flagging</a>
      <a class="nav-item" href="#"><i class="ti ti-shield"></i> Enrollments</a>
      <a class="nav-item" href="#"><i class="ti ti-handshake"></i> Partners</a>
      <div class="nav-label">Settings</div>
      <a class="nav-item" href="#"><i class="ti ti-building"></i> Practice</a>
      <a class="nav-item" href="#"><i class="ti ti-user-cog"></i> Providers</a>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar">PY</div>
      <div style="flex:1;min-width:0;">
        <div class="user-name">Peter Yoo</div>
        <div class="user-email">peter.yoo@integralhealth.me</div>
      </div>
      <i class="ti ti-chevron-down" style="font-size:13px;color:#9CA3AF;margin-left:auto;"></i>
    </div>
  </aside>

  <header class="topbar">
    <a class="back-btn" href="index.html"><i class="ti ti-arrow-left"></i> Eligibility</a>
    <div class="topbar-divider"></div>
    <span class="topbar-title" id="topbar-name">Patient detail</span>
  </header>

  <main class="main" id="main-content">
    <div class="not-found">Loading…</div>
  </main>

  <script>
    const PATIENTS = [
      {
        id: 1, name: "James Lee", age: 52, lastVisit: "Apr 8, 2026",
        status: "eligible",
        reasoning: "3 chronic conditions with recent ER utilization and patient-reported low mood — multiple converging signals suggest unaddressed behavioral health need.",
        signals: [
          { type: "obs",     label: "PHQ-9: 14" },
          { type: "chronic", label: "Type 2 diabetes" },
          { type: "chronic", label: "Hypertension" },
          { type: "er",      label: "2 ER visits / 90 days" },
          { type: "family",  label: "Family Hx: depression" },
          { type: "obs",     label: "Sleep complaints" }
        ],
        details: {
          mentalHealthDx:  null,
          psychiatricMeds: [],
          chronicDx:       ["Type 2 diabetes", "Hypertension", "Obesity"],
          erVisits:        "2 visits in the last 90 days",
          substanceUse:    null,
          familyHistory:   "Father: depression",
          phq9:            { score: 14, date: "Mar 20, 2026" },
          gad7:            null
        }
      },
      {
        id: 2, name: "Sofia Reyes", age: 38, lastVisit: "Apr 10, 2026",
        status: "eligible",
        reasoning: "Chronic pain with frequent ER visits and clinically observed anxiety — pattern consistent with undertreated behavioral health need.",
        signals: [
          { type: "obs",     label: "PHQ-9: 11" },
          { type: "obs",     label: "GAD-7: 12" },
          { type: "chronic", label: "Chronic pain syndrome" },
          { type: "er",      label: "3 ER visits / 6 months" },
          { type: "obs",     label: "Sleep complaints" }
        ],
        details: {
          mentalHealthDx:  null,
          psychiatricMeds: [],
          chronicDx:       ["Chronic pain syndrome", "Fibromyalgia"],
          erVisits:        "3 visits in the last 6 months",
          substanceUse:    null,
          familyHistory:   null,
          phq9:            { score: 11, date: "Mar 30, 2026" },
          gad7:            { score: 12, date: "Mar 30, 2026" }
        }
      },
      {
        id: 3, name: "Thomas Nguyen", age: 45, lastVisit: "Mar 28, 2026",
        status: "eligible",
        reasoning: "Single chronic condition with family history and self-reported stress — worth monitoring closely.",
        signals: [
          { type: "obs",     label: "GAD-7: 9" },
          { type: "chronic", label: "Hypertension" },
          { type: "family",  label: "Family Hx: anxiety" },
          { type: "obs",     label: "Stress reported" }
        ],
        details: {
          mentalHealthDx:  null,
          psychiatricMeds: [],
          chronicDx:       ["Hypertension"],
          erVisits:        null,
          substanceUse:    null,
          familyHistory:   "Mother: generalized anxiety disorder",
          phq9:            { score: 7, date: "Feb 14, 2026" },
          gad7:            { score: 9, date: "Feb 14, 2026" }
        }
      },
      {
        id: 4, name: "Maria Okonkwo", age: 61, lastVisit: "Apr 2, 2026",
        status: "eligible",
        reasoning: "Chronic condition with family history and fatigue — may be masking underlying depression.",
        signals: [
          { type: "obs",     label: "PHQ-9: 8" },
          { type: "chronic", label: "Type 2 diabetes" },
          { type: "family",  label: "Family Hx: depression" },
          { type: "obs",     label: "Fatigue reported" }
        ],
        details: {
          mentalHealthDx:  null,
          psychiatricMeds: [],
          chronicDx:       ["Type 2 diabetes", "Hypothyroidism"],
          erVisits:        null,
          substanceUse:    null,
          familyHistory:   "Mother: major depression",
          phq9:            { score: 8, date: "Mar 5, 2026" },
          gad7:            null
        }
      },
      {
        id: 5, name: "David Walsh", age: 29, lastVisit: "Apr 5, 2026",
        status: "ineligible",
        note: "Insufficient signals. Family history only, no chronic conditions or ER visits.",
        reasoning: "Family history only with mild sleep complaints — no chronic conditions or ER visits; monitor at routine visits.",
        signals: [
          { type: "obs",    label: "PHQ-9: 4" },
          { type: "family", label: "Family Hx: depression" },
          { type: "obs",    label: "Sleep complaints" }
        ],
        details: {
          mentalHealthDx:  null,
          psychiatricMeds: [],
          chronicDx:       [],
          erVisits:        null,
          substanceUse:    null,
          familyHistory:   "Sibling: depression",
          phq9:            { score: 4, date: "Apr 1, 2026" },
          gad7:            null
        }
      },
      {
        id: 6, name: "Linda Park", age: 55, lastVisit: "Apr 1, 2026",
        status: "eligible",
        reasoning: "Two chronic conditions with a recent ER visit and clinician-observed low mood — signals strongly align with CoCM eligibility criteria.",
        signals: [
          { type: "obs",     label: "PHQ-9: 12" },
          { type: "chronic", label: "COPD" },
          { type: "chronic", label: "Hypertension" },
          { type: "er",      label: "1 ER visit / 30 days" },
          { type: "obs",     label: "Low mood reported" }
        ],
        details: {
          mentalHealthDx:  "F32.0 — Major depressive disorder, mild",
          psychiatricMeds: ["Sertraline 50mg"],
          chronicDx:       ["COPD", "Hypertension"],
          erVisits:        "1 visit in the last 30 days",
          substanceUse:    null,
          familyHistory:   null,
          phq9:            { score: 12, date: "Mar 28, 2026" },
          gad7:            null
        }
      }
    ];

    let currentPatientId = null;

    function initials(name) {
      return name.split(' ').map(w => w[0]).join('').toUpperCase();
    }

    function getEffectiveStatus(p) {
      return localStorage.getItem('status_' + p.id) || p.status;
    }

    function getEffectiveNote(p) {
      const stored = localStorage.getItem('note_' + p.id);
      return stored !== null ? stored : (p.note || null);
    }

    function markIneligible() {
      const noteEl = document.getElementById('note-input');
      const note   = noteEl ? noteEl.value.trim() : '';
      localStorage.setItem('status_' + currentPatientId, 'ineligible');
      if (note) localStorage.setItem('note_' + currentPatientId, note);
      else      localStorage.removeItem('note_' + currentPatientId);
      render();
    }

    function undoIneligible() {
      localStorage.setItem('status_' + currentPatientId, 'eligible');
      localStorage.removeItem('note_' + currentPatientId);
      render();
    }

    function render() {
      const params = new URLSearchParams(location.search);
      const id = parseInt(params.get('id'), 10);
      const p  = PATIENTS.find(x => x.id === id);
      currentPatientId = id;
      const main = document.getElementById('main-content');

      if (!p) {
        main.innerHTML = `<div class="not-found">Patient not found.</div>`;
        return;
      }

      document.title = p.name + ' — Patient Detail';
      document.getElementById('topbar-name').textContent = p.name;

      const status    = getEffectiveStatus(p);
      const note      = getEffectiveNote(p);
      const pillLabel = status.charAt(0).toUpperCase() + status.slice(1);
      const d = p.details;

      // Action card
      let actionHtml;
      if (status === 'eligible') {
        actionHtml = `
          <div class="card">
            <div class="action-area">
              <button class="btn-ineligible" onclick="markIneligible()">Mark ineligible</button>
              <div class="note-field">
                <label class="note-label" for="note-input">Add a note (optional)</label>
                <input class="note-input" type="text" id="note-input">
              </div>
            </div>
          </div>`;
      } else {
        actionHtml = `
          <div class="card">
            <div class="ineligible-state">
              <span class="status-pill pill-ineligible">Ineligible</span>
              ${note ? `<span class="ineligible-note">${note}</span>` : ''}
              <a class="undo-link" href="#" onclick="undoIneligible(); return false;">Undo</a>
            </div>
          </div>`;
      }

      // Clinical data card — scores + EMR in one block
      const hasScores = d.phq9 || d.gad7;

      let scoresBlock = '';
      if (hasScores) {
        const blocks = [];
        if (d.phq9) blocks.push(`
          <div class="score-block">
            <span class="score-label">PHQ-9</span>
            <span class="score-num">${d.phq9.score}</span>
            <span class="score-date">${d.phq9.date}</span>
          </div>`);
        if (d.gad7) blocks.push(`
          <div class="score-block">
            <span class="score-label">GAD-7</span>
            <span class="score-num">${d.gad7.score}</span>
            <span class="score-date">${d.gad7.date}</span>
          </div>`);
        scoresBlock = `<div class="scores-row">${blocks.join('')}</div>`;
      }

      const emrRows = [];
      if (d.mentalHealthDx)                    emrRows.push(['Mental health Dx', d.mentalHealthDx]);
      if (d.psychiatricMeds?.length)           emrRows.push(['Psychiatric meds', d.psychiatricMeds.join(', ')]);
      if (d.chronicDx?.length)                 emrRows.push(['Chronic Dx',       d.chronicDx.join(', ')]);
      if (d.erVisits)                          emrRows.push(['ER visits',         d.erVisits]);
      if (d.substanceUse)                      emrRows.push(['Substance use',     d.substanceUse]);
      if (d.familyHistory)                     emrRows.push(['Family history',    d.familyHistory]);

      let emrBlock = '';
      if (emrRows.length) {
        const cells = emrRows.map(([label, value], i) => {
          const divider = i > 0 ? '<div class="emr-divider"></div>' : '';
          return `${divider}<span class="emr-label">${label}</span><span class="emr-value">${value}</span>`;
        }).join('');
        emrBlock = `<div class="emr-grid${hasScores ? ' with-scores' : ''}">${cells}</div>`;
      }

      const clinicalHtml = (scoresBlock || emrBlock) ? `
        <div class="card">${scoresBlock}${emrBlock}</div>` : '';

      main.innerHTML = `
        <div class="patient-header">
          <div class="header-avatar">${initials(p.name)}</div>
          <div class="header-info">
            <div class="header-name-row">
              <span class="header-name">${p.name}</span>
              <span class="status-pill pill-${status}">${pillLabel}</span>
            </div>
            <div class="header-meta">${p.age} yo · Last visit ${p.lastVisit}</div>
          </div>
        </div>
        ${actionHtml}
        ${clinicalHtml}
      `;
    }

    render();
  </script>
</body>
</html>
