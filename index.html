<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Eligibility Overview</title>
  <style>
    :root {
      --bg:             #f8f9fa;
      --surface:        #ffffff;
      --border:         #e5e7eb;
      --text:           #111827;
      --text-mid:       #374151;
      --text-muted:     #6b7280;
      --primary:        #2563eb;
      --primary-hover:  #1d4ed8;
      --primary-light:  #eff6ff;
      --high:           #dc2626;
      --high-bg:        #fef2f2;
      --medium:         #d97706;
      --medium-bg:      #fffbeb;
      --low:            #16a34a;
      --low-bg:         #f0fdf4;
      --radius-sm:      8px;
      --radius-md:      12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:            #0f1117;
        --surface:       #1a1d27;
        --border:        #2d3040;
        --text:          #f1f5f9;
        --text-mid:      #cbd5e1;
        --text-muted:    #8b92a8;
        --primary:       #3b82f6;
        --primary-hover: #2563eb;
        --primary-light: #1e3a5f;
        --high:          #ef4444;
        --high-bg:       #2d1515;
        --medium:        #f59e0b;
        --medium-bg:     #2d2208;
        --low:           #22c55e;
        --low-bg:        #0d2b18;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .provider-name { font-weight: 600; color: var(--text-mid); }

    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
    }

    /* ── MAIN ── */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* ── METRICS ── */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px 22px;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .metric-value.danger { color: var(--high); }

    .metric-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-chronic     { background: #dc2626; }
    .dot-er          { background: #d97706; }
    .dot-family      { background: #7c3aed; }
    .dot-observation { background: #2563eb; }

    /* ── FILTERS ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 7px 16px;
      border: 1px solid var(--border);
      border-radius: 9999px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
      white-space: nowrap;
    }

    .filter-btn:hover { border-color: var(--primary); color: var(--primary); }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* ── SECTION HEADERS ── */
    .section-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 6px 0 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
      margin-top: 28px;
    }

    .section-header:first-child { margin-top: 0; }

    .section-high   { color: var(--high); }
    .section-medium { color: var(--medium); }
    .section-low    { color: var(--low); }
    .section-referred { color: var(--text-muted); }

    /* ── PATIENT ROW ── */
    .patient-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }

    .patient-row.referred { opacity: 0.6; }

    .row-high            { border-left-color: var(--high); }
    .row-medium          { border-left-color: var(--medium); }
    .row-low             { border-left-color: var(--low); }
    .row-referred-border { border-left-color: #9ca3af; }

    /* ── AVATAR ── */
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ── ROW BODY ── */
    .row-body { flex: 1; min-width: 0; }

    .row-top {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .patient-name  { font-size: 15px; font-weight: 600; color: var(--text); }
    .patient-meta  { font-size: 13px; color: var(--text-muted); }

    .signals {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .signal-badge {
      font-size: 12px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }

    .sig-chronic     { background: #fcebeb; color: #a32d2d; }
    .sig-er          { background: #faeeda; color: #854f0b; }
    .sig-family      { background: #eeedfe; color: #3c3489; }
    .sig-observation { background: #e6f1fb; color: #185fa5; }

    .reasoning {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* ── ROW RIGHT ── */
    .row-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
      padding-left: 8px;
    }

    .risk-label {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-sm);
    }

    .risk-high   { background: var(--high-bg);   color: var(--high); }
    .risk-medium { background: var(--medium-bg); color: var(--medium); }
    .risk-low    { background: var(--low-bg);    color: var(--low); }

    .signal-count {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-actions { display: flex; gap: 6px; }

    .btn-refer {
      padding: 7px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.12s;
    }

    .btn-refer:hover { background: var(--primary-hover); }

    .btn-notnow {
      padding: 7px 14px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: border-color 0.12s, color 0.12s;
    }

    .btn-notnow:hover { border-color: #ef4444; color: #ef4444; }

    .referred-label {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
      font-size: 15px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 680px) {
      .metrics-row { grid-template-columns: repeat(2, 1fr); }
      .topbar-right .specialty,
      .topbar-right .sync-indicator { display: none; }
      .patient-row { flex-wrap: wrap; }
      .row-right {
        flex-direction: row;
        align-items: center;
        width: 100%;
        justify-content: space-between;
        padding-left: 0;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-title">Patient eligibility overview</div>
    <div class="topbar-right">
      <span class="provider-name">Dr. Peter Yoo</span>
      <span class="specialty">Internal Medicine</span>
      <span class="sync-indicator">
        <span class="sync-dot"></span>
        Last synced Apr 13, 2026
      </span>
    </div>
  </header>

  <main class="main">
    <div class="metrics-row" id="metrics-row"></div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot dot-chronic"></div> Chronic condition</div>
      <div class="legend-item"><div class="legend-dot dot-er"></div> ER visit history</div>
      <div class="legend-item"><div class="legend-dot dot-family"></div> Family history</div>
      <div class="legend-item"><div class="legend-dot dot-observation"></div> Clinical observation</div>
    </div>

    <div class="filter-bar" id="filter-bar"></div>

    <div id="patient-list"></div>
  </main>

  <script>
    const PATIENTS = [
      {
        id: 1,
        name: "James Lee",
        age: 52,
        lastVisit: "Apr 8, 2026",
        risk: "high",
        referred: false,
        reasoning: "3 chronic conditions with recent ER utilization and patient-reported low mood — multiple converging signals suggest unaddressed behavioral health need.",
        signals: [
          { type: "chronic",     label: "Type 2 diabetes" },
          { type: "chronic",     label: "Hypertension" },
          { type: "er",          label: "2 ER visits in 90 days" },
          { type: "family",      label: "Family Hx: depression" },
          { type: "observation", label: "Low mood reported" },
          { type: "observation", label: "Sleep complaints" }
        ]
      },
      {
        id: 2,
        name: "Sofia Reyes",
        age: 38,
        lastVisit: "Apr 10, 2026",
        risk: "high",
        referred: false,
        reasoning: "Chronic pain with frequent ER visits and clinically observed anxiety — pattern consistent with undertreated behavioral health need.",
        signals: [
          { type: "chronic",     label: "Chronic pain" },
          { type: "er",          label: "3 ER visits in 6 months" },
          { type: "observation", label: "Mild anxiety observed" },
          { type: "observation", label: "Sleep complaints" }
        ]
      },
      {
        id: 3,
        name: "Thomas Nguyen",
        age: 45,
        lastVisit: "Mar 28, 2026",
        risk: "medium",
        referred: false,
        reasoning: "Single chronic condition with family history and self-reported stress — worth monitoring closely.",
        signals: [
          { type: "chronic",     label: "Hypertension" },
          { type: "family",      label: "Family Hx: anxiety" },
          { type: "observation", label: "Stress reported" }
        ]
      },
      {
        id: 4,
        name: "Maria Okonkwo",
        age: 61,
        lastVisit: "Apr 2, 2026",
        risk: "medium",
        referred: false,
        reasoning: "Chronic condition with family history and fatigue — may be masking underlying depression.",
        signals: [
          { type: "chronic",     label: "Type 2 diabetes" },
          { type: "family",      label: "Family Hx: depression" },
          { type: "observation", label: "Fatigue reported" }
        ]
      },
      {
        id: 5,
        name: "David Walsh",
        age: 29,
        lastVisit: "Apr 5, 2026",
        risk: "low",
        referred: false,
        reasoning: "Family history only with mild sleep complaints — no chronic conditions or ER visits; monitor at routine visits.",
        signals: [
          { type: "family",      label: "Family Hx: depression" },
          { type: "observation", label: "Sleep complaints" }
        ]
      }
    ];

    let patients = PATIENTS.map(p => ({ ...p }));
    let activeFilter = 'all';

    const FILTERS = [
      { key: 'all',      label: 'All candidates' },
      { key: 'high',     label: 'High risk' },
      { key: 'medium',   label: 'Medium risk' },
      { key: 'low',      label: 'Low risk' },
      { key: 'referred', label: 'Referred' },
    ];

    function initials(name) {
      return name.split(' ').map(w => w[0]).join('').toUpperCase();
    }

    function countFor(key) {
      if (key === 'all')      return patients.filter(p => !p.referred).length;
      if (key === 'referred') return patients.filter(p => p.referred).length;
      return patients.filter(p => p.risk === key && !p.referred).length;
    }

    function getFiltered() {
      if (activeFilter === 'all')      return patients.filter(p => !p.referred);
      if (activeFilter === 'referred') return patients.filter(p => p.referred);
      return patients.filter(p => p.risk === activeFilter && !p.referred);
    }

    function renderMetrics() {
      const total   = patients.length;
      const active  = patients.filter(p => !p.referred).length;
      const pct     = total ? Math.round(active / total * 100) : 0;
      const high    = patients.filter(p => p.risk === 'high' && !p.referred).length;
      const referred = patients.filter(p => p.referred).length;

      document.getElementById('metrics-row').innerHTML = `
        <div class="metric-card">
          <div class="metric-label">Total Panel</div>
          <div class="metric-value">${total}</div>
          <div class="metric-sub">Active patients</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">CoCM Candidates</div>
          <div class="metric-value">${active}</div>
          <div class="metric-sub">${pct}% of panel</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">High Risk</div>
          <div class="metric-value danger">${high}</div>
          <div class="metric-sub">Refer this week</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Referred This Month</div>
          <div class="metric-value">${referred}</div>
          <div class="metric-sub">Successfully actioned</div>
        </div>
      `;
    }

    function renderFilters() {
      document.getElementById('filter-bar').innerHTML = FILTERS.map(f => `
        <button class="filter-btn ${activeFilter === f.key ? 'active' : ''}"
                onclick="setFilter('${f.key}')">
          ${f.label} (${countFor(f.key)})
        </button>
      `).join('');
    }

    function renderRow(p) {
      const borderCls = p.referred ? 'row-referred-border' : `row-${p.risk}`;
      const riskLabel = p.risk.charAt(0).toUpperCase() + p.risk.slice(1);
      const badges    = p.signals.map(s =>
        `<span class="signal-badge sig-${s.type}">${s.label}</span>`
      ).join('');
      const actions = p.referred
        ? `<span class="referred-label">Referred ✓</span>`
        : `<div class="btn-actions">
             <button class="btn-refer"   onclick="refer(${p.id})">Refer to CoCM</button>
             <button class="btn-notnow"  onclick="notnow(${p.id})">Not now</button>
           </div>`;

      return `
        <div class="patient-row ${p.referred ? 'referred' : ''} ${borderCls}" id="row-${p.id}">
          <div class="avatar">${initials(p.name)}</div>
          <div class="row-body">
            <div class="row-top">
              <span class="patient-name">${p.name}</span>
              <span class="patient-meta">${p.age} yo · Last visit ${p.lastVisit}</span>
            </div>
            <div class="signals">${badges}</div>
            <div class="reasoning">${p.reasoning}</div>
          </div>
          <div class="row-right">
            <span class="risk-label risk-${p.risk}">${riskLabel}</span>
            <span class="signal-count">${p.signals.length} signal${p.signals.length !== 1 ? 's' : ''}</span>
            ${actions}
          </div>
        </div>`;
    }

    function renderPatients() {
      const list     = document.getElementById('patient-list');
      const filtered = getFiltered();

      if (!filtered.length) {
        list.innerHTML = `<div class="empty-state">No patients in this category.</div>`;
        return;
      }

      if (activeFilter === 'referred') {
        list.innerHTML = `
          <div class="section-header section-referred">Already referred</div>
          ${filtered.map(renderRow).join('')}`;
        return;
      }

      const sections = [
        { key: 'high',   label: 'High risk — refer this week',    cls: 'section-high' },
        { key: 'medium', label: 'Medium risk — review this month', cls: 'section-medium' },
        { key: 'low',    label: 'Low risk — monitor',              cls: 'section-low' },
      ];

      const toShow = activeFilter === 'all'
        ? sections
        : sections.filter(s => s.key === activeFilter);

      list.innerHTML = toShow.map(sec => {
        const rows = filtered.filter(p => p.risk === sec.key);
        if (!rows.length) return '';
        return `<div class="section-header ${sec.cls}">${sec.label}</div>` + rows.map(renderRow).join('');
      }).join('');
    }

    function refer(id) {
      const p = patients.find(p => p.id === id);
      if (p) p.referred = true;
      render();
    }

    function notnow(id) {
      patients = patients.filter(p => p.id !== id);
      render();
    }

    function setFilter(key) {
      activeFilter = key;
      render();
    }

    function render() {
      renderMetrics();
      renderFilters();
      renderPatients();
    }

    render();
  </script>
</body>
</html>
